name: taco_sales_insight
description: "TACO Sales Insight Mobile App for Sales Representatives"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/taco_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/taco_logo.png"

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.8
  iconsax_flutter: ^1.0.1
  
  # Navigation
  go_router: ^14.0.1
  
  # State Management
  provider: ^6.1.2
  
  # HTTP Client
  http: ^1.2.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Date Formatting
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/taco_logo.png

  # Fonts
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf